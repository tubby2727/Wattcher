name: android
# Builds the Android app on every push to app/ (debug APK as an artifact) and publishes build logs to the ci-logs-app branch.
on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          set -o pipefail
          {
            npm install
            npx vite build
            npx cap add android
            python3 scripts/patch_android.py
            npx cap sync android
            (cd android && ./gradlew assembleDebug --no-daemon)
          } 2>&1 | tee "$GITHUB_WORKSPACE/build-app.log"
      - name: Publish log to ci-logs-app branch
        if: always() && github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p /tmp/l && cp "$GITHUB_WORKSPACE/build-app.log" /tmp/l/ 2>&1 || ls -la "$GITHUB_WORKSPACE" > /tmp/l/ls.txt
          echo "sha=$GITHUB_SHA status=${{ job.status }}" > /tmp/l/status.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-app-tmp && git rm -rf . -q
          cp /tmp/l/* . && git add -A && git commit -qm "app build log for $GITHUB_SHA"
          git push -f origin HEAD:ci-logs-app
      - uses: actions/upload-artifact@v4
        with: { name: wattcher-debug-apk, path: app/android/app/build/outputs/apk/debug/app-debug.apk }
