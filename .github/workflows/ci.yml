name: ci
on: [push, pull_request]
permissions:
  contents: write
jobs:
  decoder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/victron firmware/test/test_victron.cpp firmware/lib/victron/victron.cpp -o t && ./t
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/core firmware/test/test_core.cpp -o t2 && ./t2
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/core firmware/test/test_alarms_claim.cpp -o t3 && ./t3
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/tempsensor firmware/test/test_atc.cpp -o t4 && ./t4
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/core firmware/test/test_frame.cpp -o t5 && ./t5
      - run: g++ -std=c++17 -Wall -Ifirmware/lib/core firmware/test/test_history.cpp -o t6 && ./t6
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio
      - name: Build firmware
        run: |
          set -o pipefail
          pio run -d firmware 2>&1 | tee build.log
      - name: Publish build log to ci-logs branch (so it can be read without opening Actions)
        continue-on-error: true
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/l && cp build.log /tmp/l/build.log 2>/dev/null || true
          echo "sha=$GITHUB_SHA status=${{ job.status }}" > /tmp/l/status.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-tmp && git rm -rf . -q
          cp /tmp/l/* . && git add -A && git commit -qm "build log for $GITHUB_SHA"
          git push -f origin HEAD:ci-logs
      - run: |
          pip install esptool
          B=firmware/.pio/build/c3_supermini
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          esptool.py --chip esp32c3 merge_bin -o wattcher-c3-factory.bin --flash_mode dio --flash_size 4MB 0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with: { name: wattcher-c3-factory-bin, path: wattcher-c3-factory.bin }
